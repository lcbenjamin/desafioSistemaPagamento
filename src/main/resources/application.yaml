spring:
  application:
    name: desafiopagamento

  datasource:
    url: jdbc:postgresql://localhost:5432/desafio_sis_pag
    username: user
    password: password
  jpa:
    properties:
      hibernate:
        ddl-auto: none
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/desafio_sis_pag
    user: user
    password: password
    connect-retries: 3
    databaseType: postgresql

external:
  authorization:
    api:
      #base-url: https://util.devi.tools
      base-url: http://127.0.0.1:3000
      path: /api/v2/authorize
      connect-timeout: 2000
      response-timeout: 5000
      read-timeout: 3000
      write-timeout: 3000


resilience4j:
  retry:
    instances:
      authorizationApi:
        max-attempts: 3 # 1 tentativa inicial + 2 retries
        wait-duration: 400ms
        retry-exceptions:
          - com.lucascosta.desafiopagamento.core.domain.exceptions.RetryableAuthorizationException
        ignore-exceptions:
          - com.lucascosta.desafiopagamento.core.domain.exceptions.NonRetryableAuthorizationException
          - com.lucascosta.desafiopagamento.core.domain.exceptions.UnknownAuthorizationException
        fail-after-max-attempts: true
